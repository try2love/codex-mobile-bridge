    <filter id="cmb-dark-window-shadow" x="132" y="204" width="616" height="454" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dy="16" stdDeviation="15" flood-color="#050B17" flood-opacity="0.24"/>
    </filter>
    <filter id="cmb-dark-phone-shadow" x="414" y="326" width="458" height="572" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dy="18" stdDeviation="17" flood-color="#050B17" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="218" fill="url(#cmb-dark-tile)"/>
  <rect x="33" y="33" width="958" height="958" rx="217" stroke="#A6C6F0" stroke-opacity="0.12" stroke-width="2"/>
  <g filter="url(#cmb-dark-window-shadow)">
    <rect x="178" y="230" width="524" height="358" rx="56" fill="url(#cmb-dark-window)"/>
    <path d="M202 314H678V530C678 549 663 564 644 564H236C217 564 202 549 202 530V314Z" fill="url(#cmb-dark-terminal)"/>
    <g fill="#F3FAFF">
