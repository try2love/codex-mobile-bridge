    <rect x="488" y="382" width="310" height="424" rx="49" fill="url(#cmb-dark-screen)"/>
    <rect x="610" y="407" width="66" height="10" rx="5" fill="#B3DCED" fill-opacity="0.4"/>
    <path d="M549 527L598 574L549 621" stroke="#F4FBFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M643 621H697" stroke="#7CEED9" stroke-width="24" stroke-linecap="round"/>
    <rect x="608" y="766" width="70" height="9" rx="4.5" fill="#B3DCED" fill-opacity="0.35"/>
