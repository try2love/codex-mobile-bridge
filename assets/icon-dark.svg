<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="cmb-dark-title cmb-dark-desc">
  <title id="cmb-dark-title">Codex Mobile Bridge · Dark</title>
  <desc id="cmb-dark-desc">A blue terminal window behind a cyan-edged phone with a command prompt, on a graphite rounded square.</desc>
  <defs>
    <linearGradient id="cmb-dark-tile" x1="272" y1="56" x2="740" y2="984" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B3444"/>
      <stop offset="1" stop-color="#141B29"/>
    </linearGradient>
    <linearGradient id="cmb-dark-window" x1="228" y1="230" x2="640" y2="588" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64ADFF"/>
      <stop offset="1" stop-color="#346DE8"/>
    </linearGradient>
    <linearGradient id="cmb-dark-terminal" x1="240" y1="318" x2="630" y2="568" gradientUnits="userSpaceOnUse">
      <stop stop-color="#294F89"/>
      <stop offset="1" stop-color="#1A3158"/>
    </linearGradient>
    <linearGradient id="cmb-dark-phone" x1="490" y1="362" x2="808" y2="806" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BF4DD"/>
      <stop offset="0.48" stop-color="#58D3F3"/>
      <stop offset="1" stop-color="#5799FF"/>
    </linearGradient>
    <linearGradient id="cmb-dark-screen" x1="528" y1="386" x2="758" y2="808" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29496C"/>
