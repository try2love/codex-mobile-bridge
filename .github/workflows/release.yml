name: Signed desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing version tag to rebuild with this workflow (leave empty to use the selected tag)
        type: string
        default: ''
      publish:
        description: Publish after verification (run this workflow on an existing version tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release identity
        env:
          CMB_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.source_ref || github.ref_name }}
        run: |
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto');
          const expected='v'+require('./package.json').version;
          if(process.env.RELEASE_TAG!==expected)throw Error('Run on the tag matching package.json: '+expected);
          const cp=require('child_process');
          if(cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==cp.execFileSync('git',['rev-list','-n','1',expected],{encoding:'utf8'}).trim())throw Error('Checkout must match the release tag.');
          const key=process.env.CMB_UPDATE_SIGNING_KEY;
          if(!key)throw Error('Configure the UPDATE_SIGNING_KEY release secret first.');
          if(crypto.createPublicKey(key).export({type:'spki',format:'pem'})!==fs.readFileSync('desktop/update-public-key.pem','utf8'))throw Error('Release signing identity does not match the app.');
          JS
  build:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    with:
      source_ref: ${{ inputs.source_ref || github.ref }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/release
      - name: Sign complete update manifest
        env:
          CMB_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: node scripts/sign-update.cjs dist/release RELEASE_NOTES.md
      - name: Upload draft then publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.source_ref || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" dist/release/* --verify-tag --draft --title "$TAG" --notes-file RELEASE_NOTES.md "${flags[@]}"
          # Preview releases stay draft until the locally signed mobile assets
          # and their checksums have been uploaded and verified by the maintainer.
          if [[ "$PUBLISH" == true && "$TAG" != *-preview.* ]]; then gh release edit "$TAG" --draft=false; fi
