name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile-update-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/test-mobile-releases.py
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.9', '3.13']
        include:
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install shell used by PTY integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Verify Windows continuous terminal before the full suite
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -p test_windows_terminal.py -v
      - name: Install optional shared relay transport for integration tests
        run: python -m pip install -r requirements-relay.txt
      - run: python -B -m unittest discover -s tests -v

  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run test:updater
