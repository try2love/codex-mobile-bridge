name: Preview3 isolated Windows diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5d2ab410093b5fcd63d6d3ad5c63be3a694c81d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-relay.txt cryptography keyring paramiko
      - name: Run scoped tests with bounded stack diagnostics
        shell: bash
        run: |
          mkdir -p .tmp/preview3-win-diagnostic
          python -u - <<'PY' 2>&1 | tee .tmp/preview3-win-diagnostic/scoped-tests.log
          import faulthandler, sys, unittest
          faulthandler.enable()
          faulthandler.dump_traceback_later(180, exit=True)
          sys.path[:0] = ['tests', '.']
          patterns = ['test_hosted_desktop*.py', 'test_edited_history.py', 'test_private_json.py', 'test_update_data_safety.py', 'test_local_rpc.py', 'test_offline_management.py']
          for pattern in patterns:
              print('DIAGNOSTIC_PATTERN', pattern, flush=True)
              suite = unittest.defaultTestLoader.discover('tests', pattern=pattern)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful():
                  raise SystemExit(1)
          faulthandler.cancel_dump_traceback_later()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview3-win-scoped-diagnostic
          include-hidden-files: true
          path: .tmp/preview3-win-diagnostic/scoped-tests.log
