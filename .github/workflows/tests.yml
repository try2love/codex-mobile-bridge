name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mobile-scope:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.scope.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          # Release tags check the entire tree; the previous tag object may no longer be reachable.
          BASE_SHA: ${{ github.ref_type != 'tag' && (github.event.pull_request.base.sha || github.event.before) || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci-mobile-scope.py
  android-compile:
    needs: mobile-scope
    if: needs.mobile-scope.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/ci-android-build.sh
  ios-compile:
    needs: mobile-scope
    if: needs.mobile-scope.outputs.changed == 'true'
    uses: ./.github/workflows/mobile.yml
    with:
      source_ref: ${{ github.sha }}
  mobile-update-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/test-mobile-releases.py
      - run: python3 scripts/test-mobile-downloads.py
      - run: python3 scripts/test-ios-events.py
      - run: python3 scripts/test-ios-notification-routing.py
      - run: python3 scripts/test-ios-notification-source.py
      - run: python3 scripts/test-ios-notification-sources.py
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.9', '3.13']
        include:
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install shell used by PTY integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Verify Windows continuous terminal before the full suite
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -p test_windows_terminal.py -v
      - name: Verify Windows native Claude controls before the full suite
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -p test_claude_native_helper.py -v
      - name: Install relay transport and Claude encrypted-reply support for integration tests
        run: python -m pip install -r requirements-relay.txt cryptography
      - run: python -B -m unittest discover -s tests -v

  desktop-tests:
    needs: [mobile-scope, android-compile, ios-compile, mobile-update-tests]
    if: always()
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: .local/tools/playwright
    steps:
      - name: Require selected mobile builds to succeed
        env:
          SCOPE_RESULT: ${{ needs.mobile-scope.result }}
          MOBILE_CHANGED: ${{ needs.mobile-scope.outputs.changed }}
          ANDROID_RESULT: ${{ needs.android-compile.result }}
          IOS_RESULT: ${{ needs.ios-compile.result }}
          MOBILE_UPDATE_RESULT: ${{ needs.mobile-update-tests.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$MOBILE_UPDATE_RESULT" = success
          if [ "$MOBILE_CHANGED" = true ]; then
            test "$ANDROID_RESULT" = success
            test "$IOS_RESULT" = success
          else
            test "$MOBILE_CHANGED" = false
            test "$ANDROID_RESULT" = skipped
            test "$IOS_RESULT" = skipped
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run test:updater
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: .tmp/browser-results/
          if-no-files-found: ignore
          include-hidden-files: true
