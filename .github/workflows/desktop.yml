name: Desktop builds
on:
  workflow_call:
    secrets:
      UPDATE_SIGNING_KEY:
        required: true
    inputs:
      source_ref:
        type: string
        default: ''
      acceptance_only:
        type: boolean
        default: false
      candidate_run_id:
        type: string
        default: ''
      acceptance_target_os:
        type: string
        default: all
      build_target:
        type: string
        default: all
      reuse_run_id:
        type: string
        default: ''
      reuse_source_ref:
        type: string
        default: ''
      reuse_mac_arm_run_id:
        type: string
        default: ''
      reuse_mac_arm_source_ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact product source commit (empty uses this workflow run SHA)
        type: string
        default: ''
      acceptance_only:
        description: Validate an existing build from official stable and preview1 packages without rebuilding
        type: boolean
        default: false
      candidate_run_id:
        description: Successful Desktop builds run ID (acceptance only)
        type: string
        default: ''
      acceptance_target_os:
        description: Acceptance platforms (ignored by ordinary builds)
        type: choice
        options: [all, Windows]
        default: all
      build_target:
        description: Build all or selected platforms with verified reuse of unaffected packages
        type: choice
        options: [all, intel, mac-windows-reuse, windows-reuse, mac-arm-reuse]
        default: all
      reuse_run_id:
        description: Completed upstream Desktop run with successful Intel and Linux jobs
        type: string
        default: ''
      reuse_source_ref:
        description: Exact upstream product SHA (selective reuse only)
        type: string
        default: ''
      reuse_mac_arm_run_id:
        description: Optional successful original Mac ARM package run
        type: string
        default: ''
      reuse_mac_arm_source_ref:
        description: Exact source for the Mac ARM override (both override inputs required)
        type: string
        default: ''
  push:
    # Main receives source updates without building Apps; use manual or release builds.
    branches: [feature/desktop-ntfy, codex/windows-desktop-app, integration/desktop-cross-platform, codex/ubuntu-support]
    paths: ['desktop/**', 'desktop.py', 'bridge/**', 'web/**', 'run.py', 'scripts/**', 'tests/**', 'package*.json', 'requirements-desktop.txt', '.github/workflows/desktop.yml']
permissions:
  contents: read
  actions: read
jobs:
  published-upgrade:
    if: inputs.acceptance_only == true
    uses: ./.github/workflows/upgrade-acceptance.yml
    secrets:
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    with:
      source_ref: ${{ inputs.source_ref }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      target_os: ${{ inputs.acceptance_target_os }}
  package:
    if: inputs.acceptance_only != true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_target == 'mac-arm-reuse' && '[{"os":"macos-15","arch":"arm64","app-dir":"mac-arm64"}]' || inputs.build_target == 'windows-reuse' && '[{"os":"windows-latest","arch":"x64"}]' || inputs.build_target == 'mac-windows-reuse' && '[{"os":"macos-15","arch":"arm64","app-dir":"mac-arm64"},{"os":"windows-latest","arch":"x64"}]' || inputs.build_target == 'intel' && '[{"os":"macos-15-intel","arch":"x64","app-dir":"mac"}]' || '[{"os":"macos-15","arch":"arm64","app-dir":"mac-arm64"},{"os":"macos-15-intel","arch":"x64","app-dir":"mac"},{"os":"windows-latest","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Verify exact selected rebuild source
        if: inputs.build_target == 'mac-windows-reuse' || inputs.build_target == 'windows-reuse' || inputs.build_target == 'mac-arm-reuse'
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re, subprocess
          source = os.environ['SOURCE_REF']
          assert re.fullmatch('[0-9a-f]{40}', source), 'Exact build SHA required'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source, 'Build checkout mismatch'
          PY
      - name: Verify reuse of completed release CI for Intel-only packaging
        if: inputs.build_target == 'intel'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          source = 'ad5e929dbade70ec1bb8429abb99f6a9a6477e7f'
          run = json.loads(subprocess.check_output(['gh', 'api', 'repos/try2love/codex-mobile-bridge/actions/runs/44759627600'], text=True))
          assert run['head_sha'] == source and run['conclusion'] == 'success'
          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', source], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', source, 'HEAD'], text=True).splitlines())
          assert changed <= {'.github/workflows/desktop.yml', 'scripts/smoke-update-controller.cjs', 'tests/release-assets.test.cjs'}, changed
          PYCODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build self-contained Intel macOS cryptography
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: OPENSSL_STATIC=1 python -m pip install --no-cache-dir --no-binary cryptography cryptography==50.0.2
      - run: python -m pip install -r requirements-desktop.txt
      - run: npm ci
      - if: inputs.build_target != 'intel'
        run: python -B -m unittest discover -s tests -v
      - if: inputs.build_target != 'intel'
        run: npm run test:desktop
      - if: inputs.build_target != 'intel'
        run: npm run test:updater
      - name: Verify native macOS published-peer upgrade handoff
        if: runner.os == 'macOS' && inputs.build_target != 'intel'
        run: python -B tests/acceptance/zcode_published_peer.py
      - run: python scripts/build-desktop.py
      - name: Verify packaged Windows continuous terminal
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -p test_windows_terminal.py -v
        env:
          CMB_TEST_RUNTIME: ${{ github.workspace }}/dist/gateway/codex-mobile-gateway.exe
      - if: runner.os == 'macOS'
        run: npm run build:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CMB_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      - name: Verify the distributed macOS DMG and ZIP
        if: runner.os == 'macOS'
        run: |
          python scripts/verify-macos.py dist/desktop/*-macOS-${{ matrix.arch }}.dmg --arch ${{ matrix.arch }}
          python scripts/verify-macos.py dist/desktop/*-macOS-${{ matrix.arch }}.zip --arch ${{ matrix.arch }}
      - name: Launch the signed macOS App
        if: runner.os == 'macOS'
        run: node scripts/smoke-macos.cjs "dist/desktop/${{ matrix.app-dir }}/Codex Mobile Bridge.app"
      - if: runner.os == 'Windows'
        run: npm run build:windows
      - name: Install and verify the complete Windows package
        if: runner.os == 'Windows'
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'cmb-release-install'
          python scripts/verify-windows-install.py --target $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-windows.cjs (Join-Path $target 'Codex Mobile Bridge.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CMB_TEST_RUNTIME = Join-Path $target 'resources/gateway/codex-mobile-gateway.exe'
          python -B -m unittest discover -s tests -p test_windows_terminal.py -v
      - name: Verify packaged Bark and ntfy notifications
        run: node scripts/smoke-notifications.cjs
      - name: Verify packaged login and device access
        run: node scripts/smoke-auth.cjs
      - name: Verify packaged Windows HTTPS trust
        if: runner.os == 'Windows'
        run: python scripts/verify-https.py "dist/desktop/win-unpacked/resources/gateway/codex-mobile-gateway.exe"
      - if: runner.os == 'macOS'
        run: npm run test:pairing
        env:
          CMB_TEST_RUNTIME: ${{ github.workspace }}/dist/gateway/codex-mobile-gateway
      - if: runner.os == 'Windows'
        run: npm run test:pairing
        env:
          CMB_TEST_RUNTIME: ${{ github.workspace }}/dist/gateway/codex-mobile-gateway.exe
      - name: Exercise packaged update and recovery
        shell: bash
        run: node scripts/smoke-update.cjs
      - name: Exercise real UI update controller handoff
        shell: bash
        run: npm run test:update-controller
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe

  linux:
    if: inputs.acceptance_only != true && inputs.build_target != 'intel' && inputs.build_target != 'mac-windows-reuse' && inputs.build_target != 'windows-reuse' && inputs.build_target != 'mac-arm-reuse'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            deb-arch: amd64
            appimage-arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            deb-arch: arm64
            appimage-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libgbm1 libasound2 libxss1 libsecret-1-0 libfuse2 xvfb xauth dbus-x11 xdg-utils iproute2 zsh
      - run: python -m pip install -r requirements-desktop.txt
      - run: npm ci
      - run: python -B -m unittest discover -s tests -v
      - run: npm run test:desktop
      - run: npm run test:updater
      - run: python scripts/build-desktop.py
      - run: npm run build:linux -- --${{ matrix.arch }}
      - name: Install and verify the Debian package
        run: |
          shopt -s nullglob
          package=(dist/desktop/*-Linux-${{ matrix.deb-arch }}.deb)
          test "${#package[@]}" -eq 1
          test "$(dpkg-deb -f "${package[0]}" Architecture)" = '${{ matrix.deb-arch }}'
          test "$(dpkg-deb -f "${package[0]}" Version)" = "$(node -p 'require("./package.json").version.replace(/-/g, "~")')"
          sudo apt-get install -y "./${package[0]}"
          executable="$(readlink -f /usr/bin/codex-mobile-bridge)"
          runtime="$(dirname "$executable")/resources/gateway/codex-mobile-gateway"
          dbus-run-session -- xvfb-run -a node scripts/smoke-linux.cjs "$executable"
          node scripts/smoke-notifications.cjs "$runtime"
          node scripts/smoke-auth.cjs "$runtime"
          python scripts/verify-https.py "$runtime"
          CMB_TEST_RUNTIME="$runtime" dbus-run-session -- xvfb-run -a npm run test:pairing
      - name: Extract and launch the AppImage payload
        run: |
          shopt -s nullglob
          image=("$GITHUB_WORKSPACE"/dist/desktop/*-Linux-${{ matrix.appimage-arch }}.AppImage)
          test "${#image[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/bridge-appimage"
          cd "$RUNNER_TEMP/bridge-appimage"
          "${image[0]}" --appimage-extract >/dev/null
          cd "$GITHUB_WORKSPACE"
          dbus-run-session -- xvfb-run -a node scripts/smoke-linux.cjs "$RUNNER_TEMP/bridge-appimage/squashfs-root/codex-mobile-bridge"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-Linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/desktop/*.deb
            dist/desktop/*.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-screenshots-${{ matrix.arch }}
          include-hidden-files: true
          path: .tmp/linux-app-*/desktop-*.png

  reuse:
    if: inputs.acceptance_only != true && (inputs.build_target == 'mac-windows-reuse' || inputs.build_target == 'windows-reuse' || inputs.build_target == 'mac-arm-reuse')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(inputs.build_target == 'mac-arm-reuse' && '["desktop-Windows-x64","desktop-macOS-x64","desktop-Linux-x64","desktop-Linux-arm64"]' || inputs.build_target == 'windows-reuse' && '["desktop-macOS-arm64","desktop-macOS-x64","desktop-Linux-x64","desktop-Linux-arm64"]' || '["desktop-macOS-x64","desktop-Linux-x64","desktop-Linux-arm64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source equivalence and successful upstream packages
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          REUSE_SOURCE_REF: ${{ inputs.reuse_source_ref }}
          REUSE_ARTIFACT: ${{ matrix.artifact }}
          REUSE_MAC_ARM_RUN_ID: ${{ inputs.reuse_mac_arm_run_id }}
          REUSE_MAC_ARM_SOURCE_REF: ${{ inputs.reuse_mac_arm_source_ref }}
        run: python -B scripts/reuse-desktop-artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: .tmp/desktop-reuse/${{ matrix.artifact }}/packages/*
      - uses: actions/upload-artifact@v4
        with:
          name: reuse-provenance-${{ matrix.artifact }}
          if-no-files-found: error
          path: .tmp/desktop-reuse/${{ matrix.artifact }}/provenance.json
