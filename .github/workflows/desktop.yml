name: Desktop builds
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: [main, feature/desktop-ntfy, codex/windows-desktop-app, integration/desktop-cross-platform, codex/ubuntu-support]
    paths: ['desktop/**', 'desktop.py', 'bridge/**', 'web/**', 'run.py', 'scripts/**', 'tests/**', 'package*.json', 'requirements-desktop.txt', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            app-dir: mac-arm64
          - os: macos-15-intel
            arch: x64
            app-dir: mac
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-desktop.txt
      - run: npm ci
      - run: python -B -m unittest discover -s tests -v
      - run: npm run test:desktop
      - run: npm run test:updater
      - run: python scripts/build-desktop.py
      - name: Verify packaged Windows continuous terminal
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -p test_windows_terminal.py -v
        env:
          CMB_TEST_RUNTIME: ${{ github.workspace }}/dist/gateway/codex-mobile-gateway.exe
      - if: runner.os == 'macOS'
        run: npm run build:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the distributed macOS DMG and ZIP
        if: runner.os == 'macOS'
        run: |
          python scripts/verify-macos.py dist/desktop/*-macOS-${{ matrix.arch }}.dmg --arch ${{ matrix.arch }}
          python scripts/verify-macos.py dist/desktop/*-macOS-${{ matrix.arch }}.zip --arch ${{ matrix.arch }}
      - name: Launch the signed macOS App
        if: runner.os == 'macOS'
        run: node scripts/smoke-macos.cjs "dist/desktop/${{ matrix.app-dir }}/Codex Mobile Bridge.app"
      - if: runner.os == 'Windows'
        run: npm run build:windows
      - if: runner.os == 'Windows'
        run: npm run test:windows-app
      - name: Verify packaged Bark and ntfy notifications
        run: node scripts/smoke-notifications.cjs
      - name: Verify packaged login and device access
        run: node scripts/smoke-auth.cjs
      - name: Verify packaged Windows HTTPS trust
        if: runner.os == 'Windows'
        run: python scripts/verify-https.py "dist/desktop/win-unpacked/resources/gateway/codex-mobile-gateway.exe"
      - if: runner.os == 'macOS'
        run: npm run test:pairing
        env:
          CMB_TEST_RUNTIME: ${{ github.workspace }}/dist/gateway/codex-mobile-gateway
      - if: runner.os == 'Windows'
        run: npm run test:pairing
        env:
          CMB_TEST_RUNTIME: ${{ github.workspace }}/dist/gateway/codex-mobile-gateway.exe
      - name: Exercise packaged update and recovery
        shell: bash
        run: node scripts/smoke-update.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            deb-arch: amd64
            appimage-arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            deb-arch: arm64
            appimage-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libgbm1 libasound2 libxss1 libsecret-1-0 libfuse2 xvfb xauth dbus-x11 xdg-utils iproute2 zsh
      - run: python -m pip install -r requirements-desktop.txt
      - run: npm ci
      - run: python -B -m unittest discover -s tests -v
      - run: npm run test:desktop
      - run: npm run test:updater
      - run: python scripts/build-desktop.py
      - run: npm run build:linux -- --${{ matrix.arch }}
      - name: Install and verify the Debian package
        run: |
          shopt -s nullglob
          package=(dist/desktop/*-Linux-${{ matrix.deb-arch }}.deb)
          test "${#package[@]}" -eq 1
          test "$(dpkg-deb -f "${package[0]}" Architecture)" = '${{ matrix.deb-arch }}'
          test "$(dpkg-deb -f "${package[0]}" Version)" = "$(node -p 'require("./package.json").version')"
          sudo apt-get install -y "./${package[0]}"
          executable="$(readlink -f /usr/bin/codex-mobile-bridge)"
          runtime="$(dirname "$executable")/resources/gateway/codex-mobile-gateway"
          dbus-run-session -- xvfb-run -a node scripts/smoke-linux.cjs "$executable"
          node scripts/smoke-notifications.cjs "$runtime"
          node scripts/smoke-auth.cjs "$runtime"
          python scripts/verify-https.py "$runtime"
          CMB_TEST_RUNTIME="$runtime" dbus-run-session -- xvfb-run -a npm run test:pairing
      - name: Extract and launch the AppImage payload
        run: |
          shopt -s nullglob
          image=("$GITHUB_WORKSPACE"/dist/desktop/*-Linux-${{ matrix.appimage-arch }}.AppImage)
          test "${#image[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/bridge-appimage"
          cd "$RUNNER_TEMP/bridge-appimage"
          "${image[0]}" --appimage-extract >/dev/null
          cd "$GITHUB_WORKSPACE"
          dbus-run-session -- xvfb-run -a node scripts/smoke-linux.cjs "$RUNNER_TEMP/bridge-appimage/squashfs-root/codex-mobile-bridge"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-Linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/desktop/*.deb
            dist/desktop/*.AppImage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-screenshots-${{ matrix.arch }}
          include-hidden-files: true
          path: .tmp/linux-app-*/desktop-*.png
