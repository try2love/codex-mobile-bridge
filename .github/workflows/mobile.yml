name: iOS unsigned build
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact product commit (required for the Intel supplement)
        type: string
        default: ''
      intel_fallback:
        description: Run the frozen release mobile checks on Intel when ARM capacity is unavailable
        type: boolean
        default: false
  push:
    branches: [release/v2.0.0]
    paths: ['mobile/**', 'web/client-icons/**', 'scripts/build-mobile-ios.py', 'tests/test_mobile_ios_build.py', 'package.json', '.github/workflows/mobile.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: ${{ inputs.intel_fallback == true && 'macos-15-intel' || 'macos-15' }}
    steps:
      - name: Validate frozen Intel supplement source
        if: inputs.intel_fallback == true
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [ "$SOURCE_REF" != '1561a0c82d8eb4f02f02c7a608f94812ba87a75f' ]; then
            echo 'Intel supplement requires the exact frozen release commit.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect available Xcode platforms
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
      - name: Verify mobile resources and archive boundaries
        run: |
          node --test mobile/tests/*.test.cjs
          python -B -m unittest discover -s tests -p test_mobile_ios_build.py -v
      - name: Build unsigned iPhone app and tracked Xcode source
        run: python scripts/build-mobile-ios.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-iOS
          if-no-files-found: error
          path: |
            dist/mobile-preview/*-iOS-unsigned.ipa
            dist/mobile-preview/*-iOS-source.zip
  mobile-update-tests:
    if: inputs.intel_fallback == true
    runs-on: macos-15-intel
    steps:
      - name: Validate frozen Intel supplement source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [ "$SOURCE_REF" != '1561a0c82d8eb4f02f02c7a608f94812ba87a75f' ]; then
            echo 'Intel supplement requires the exact frozen release commit.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/test-mobile-releases.py
      - run: python3 scripts/test-mobile-downloads.py
      - run: python3 scripts/test-ios-events.py
      - run: python3 scripts/test-ios-notification-routing.py
      - run: python3 scripts/test-ios-notification-source.py
      - run: python3 scripts/test-ios-notification-sources.py
