plugins { id 'com.android.application' version '8.7.3'; id 'com.google.gms.google-services' version '4.4.2' }
android {
 namespace 'io.github.try2love.codexbridge.preview'
 compileSdk 35
 buildToolsVersion "35.0.0"
 defaultConfig { applicationId 'io.github.try2love.codexbridge.preview'; minSdk 26; targetSdk 35; versionCode 92; versionName '2.2.2-preview.4' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['../android/src', 'src']; res.srcDirs = ['../android/res']; assets.srcDirs = ['../shared/web', '../android/assets', '../../web/client-icons'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 signingConfigs { preview { storeFile file('../../.tmp/mobile-tools/preview-debug.p12'); storePassword 'android'; keyAlias 'preview'; keyPassword 'android' } }
 buildTypes { debug { signingConfig signingConfigs.preview } }
}
dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.0'; implementation 'com.google.zxing:core:3.5.3' }

// Reuse the repository notices without copying project files into the APK.
def licenseAssets = layout.buildDirectory.dir('generated/license-assets')
def prepareLicenseAssets = tasks.register('prepareLicenseAssets', Sync) {
 from('../../LICENSE', '../../NOTICE')
 into(licenseAssets)
}
android.sourceSets.main.assets.srcDir(licenseAssets)
def chatAssets = layout.buildDirectory.dir('generated/chat-assets')
def prepareChatAssets = tasks.register('prepareChatAssets', Exec) {
 inputs.dir('../../web')
 inputs.files('../../scripts/build-offline-shell.py', '../../bridge/api/assets.py', '../../bridge/resources.py')
 outputs.dir(chatAssets)
 commandLine('python3', '-B', '../../scripts/build-offline-shell.py', chatAssets.get().dir('offline-shell').asFile)
}
android.sourceSets.main.assets.srcDir(chatAssets)
tasks.named('preBuild').configure { dependsOn(prepareLicenseAssets, prepareChatAssets) }
